<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家系図作成アプリ</title>
  <meta name="description" content="A3横・A4横で印刷できる家系図を、ブラウザだけで作れます。">
  <meta name="theme-color" content="#f4fbf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家系図">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
{{styles}}
  </style>
  <style id="printPaperStyle"></style>
</head>
<body>
{{icons}}

  <main class="app">
    <aside class="sidebar" id="editorSidebar">
      <button type="button" class="sheet-handle" id="sheetToggle" aria-expanded="true" aria-controls="editorSidebar">
        <span class="sheet-grip" aria-hidden="true"></span>
        <span class="sheet-label">人物を編集</span>
      </button>
      <div class="app-title">
        <span class="app-icon"><svg class="icon" aria-hidden="true"><use href="#ic-tree"/></svg></span>
        <div>
          <h1>家系図作成アプリ</h1>
          <p class="app-subtitle">Family tree composer</p>
        </div>
      </div>

      <section class="card">
        <div class="card-head">
          <svg class="icon" aria-hidden="true"><use href="#ic-person"/></svg>
          <h2>人物を編集</h2>
        </div>
        <form id="personForm" novalidate>
          <label>
            氏名
            <input id="name" type="text" autocomplete="off" required>
            <span class="field-error" id="nameError" hidden></span>
          </label>
          <label>
            続柄
            <div class="inline-field">
              <input id="relation" type="text" list="relationSuggestions" placeholder="例: 長男、母、配偶者">
              <button type="button" class="secondary" id="suggestRelationBtn"><svg class="icon" aria-hidden="true"><use href="#ic-bulb"/></svg><span class="btn-label">候補</span></button>
            </div>
            <datalist id="relationSuggestions">
              <option value="本人"></option>
              <option value="父"></option>
              <option value="母"></option>
              <option value="祖父"></option>
              <option value="祖母"></option>
              <option value="長男"></option>
              <option value="長女"></option>
              <option value="次男"></option>
              <option value="次女"></option>
              <option value="養子"></option>
              <option value="配偶者"></option>
            </datalist>
          </label>
          <div class="grid-2">
            <label>
              生没年
              <input id="years" type="text" placeholder="1930-2005">
            </label>
            <label>
              世代
              <input id="generation" type="number" min="0" max="12" required>
              <span class="field-error" id="generationError" hidden></span>
            </label>
          </div>
          <div class="relation-field">
            <div class="relation-head">
              <span class="relation-label">親</span>
              <button type="button" class="tonal-sm" id="addParentBtn"><svg class="icon" aria-hidden="true"><use href="#ic-add"/></svg>親を選ぶ</button>
            </div>
            <div class="relation-list" id="parentList"></div>
          </div>
          <div class="relation-field">
            <div class="relation-head">
              <span class="relation-label">配偶者</span>
              <button type="button" class="tonal-sm" id="addSpouseBtn"><svg class="icon" aria-hidden="true"><use href="#ic-add"/></svg>配偶者を選ぶ</button>
            </div>
            <div class="relation-list" id="spouseList"></div>
          </div>
          <div class="actions">
            <button type="submit" id="saveBtn"><svg class="icon" aria-hidden="true"><use href="#ic-check"/></svg><span class="btn-label">保存</span></button>
            <button type="button" class="secondary" id="newBtn"><svg class="icon" aria-hidden="true"><use href="#ic-add"/></svg><span class="btn-label">新規</span></button>
            <button type="button" class="danger" id="deleteBtn"><svg class="icon" aria-hidden="true"><use href="#ic-delete"/></svg><span class="btn-label">削除</span></button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-head">
          <svg class="icon" aria-hidden="true"><use href="#ic-people"/></svg>
          <h2>人物一覧</h2>
        </div>
        <div class="people-list" id="peopleList"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <svg class="icon" aria-hidden="true"><use href="#ic-code"/></svg>
          <h2>JSON</h2>
        </div>
        <label>
          データ
          <textarea id="jsonEditor" spellcheck="false"></textarea>
        </label>
        <div class="actions">
          <button type="button" class="secondary" id="applyJsonBtn"><svg class="icon" aria-hidden="true"><use href="#ic-check"/></svg><span class="btn-label">JSON反映</span></button>
          <button type="button" class="secondary" id="exportJsonBtn"><svg class="icon" aria-hidden="true"><use href="#ic-download"/></svg><span class="btn-label">JSON書き出し</span></button>
          <button type="button" class="secondary" id="importJsonBtn"><svg class="icon" aria-hidden="true"><use href="#ic-upload"/></svg><span class="btn-label">JSON読込</span></button>
          <button type="button" class="secondary" id="sampleBtn"><svg class="icon" aria-hidden="true"><use href="#ic-sparkle"/></svg><span class="btn-label">サンプル復元</span></button>
          <input id="jsonFileInput" type="file" accept="application/json,.json" hidden>
        </div>
        <div class="download-box" id="jsonDownloadBox">
          <a class="download-link" id="jsonDownloadLink" href="#" download><svg class="icon" aria-hidden="true"><use href="#ic-download"/></svg>JSONファイルを保存</a>
        </div>
        <div class="backup-box" id="backupBox" hidden>
          <div class="card-head">
            <svg class="icon" aria-hidden="true"><use href="#ic-history"/></svg>
            <h2>自動バックアップ</h2>
          </div>
          <div class="backup-list" id="backupList"></div>
        </div>
      </section>

      <div class="snackbar" id="snackbar" hidden>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <button type="button" class="snackbar-action" id="undoBtn" hidden>元に戻す</button>
      </div>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <strong id="summary" class="chip">0人</strong>
        <span class="status chip chip-outline" id="layoutSummary"></span>
        <button type="button" class="icon-button" id="undoActionBtn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す" disabled><svg class="icon" aria-hidden="true"><use href="#ic-undo"/></svg></button>
        <button type="button" class="icon-button" id="redoActionBtn" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す" disabled><svg class="icon" aria-hidden="true"><use href="#ic-redo"/></svg></button>
        <span class="spacer"></span>
        <label class="toolbar-size">
          用紙サイズ
          <select id="paperSize">
            <option value="a3">A3横</option>
            <option value="a4">A4横</option>
          </select>
        </label>
        <button type="button" class="secondary" id="fitBtn"><svg class="icon" aria-hidden="true"><use href="#ic-refresh"/></svg><span class="btn-label">再描画</span></button>
        <button type="button" class="secondary" id="manualLayoutBtn" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#ic-move"/></svg><span class="btn-label">配置調整</span></button>
        <button type="button" class="secondary" id="resetLayoutBtn"><svg class="icon" aria-hidden="true"><use href="#ic-restore"/></svg><span class="btn-label">自動配置に戻す</span></button>
        <button type="button" class="secondary" id="exportPngBtn"><svg class="icon" aria-hidden="true"><use href="#ic-image"/></svg><span class="btn-label">画像で保存</span></button>
        <button type="button" class="secondary" id="installBtn" hidden><svg class="icon" aria-hidden="true"><use href="#ic-install"/></svg><span class="btn-label">アプリとして追加</span></button>
        <button type="button" id="printBtn"><svg class="icon" aria-hidden="true"><use href="#ic-print"/></svg><span class="btn-label">印刷</span></button>
      </div>
      <div class="canvas-wrap">
        <div class="paper">
          <canvas id="treeCanvas" aria-label="家系図プレビュー"></canvas>
        </div>
      </div>
    </section>
  </main>

  <dialog id="pickerDialog" class="picker-dialog" aria-labelledby="pickerTitle">
    <div class="dialog-head">
      <svg class="icon" aria-hidden="true"><use href="#ic-people"/></svg>
      <h2 class="dialog-title" id="pickerTitle">人物を選ぶ</h2>
    </div>
    <label class="picker-search">
      名前で絞り込む
      <input id="pickerSearch" type="search" autocomplete="off" placeholder="例: 太郎">
    </label>
    <div class="picker-list" id="pickerList"></div>
    <p class="picker-empty" id="pickerEmpty" hidden>選べる人物がいません。先に人物を追加してください。</p>
    <div class="dialog-actions">
      <button type="button" class="text" id="pickerCancelBtn">キャンセル</button>
    </div>
  </dialog>

  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <div class="dialog-head">
        <svg class="icon" aria-hidden="true"><use href="#ic-warning"/></svg>
        <h2 class="dialog-title" id="confirmTitle">確認</h2>
      </div>
      <p class="dialog-body" id="confirmBody"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="text" id="confirmCancelBtn">キャンセル</button>
        <button type="submit" value="ok" class="danger" id="confirmOkBtn">削除</button>
      </div>
    </form>
  </dialog>

  <script>
{{script}}
  </script>
</body>
</html>
