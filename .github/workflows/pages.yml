# main へのpushでテストを通し、配布物だけをGitHub Pagesへ公開する。
# 初回だけ、リポジトリの Settings > Pages で Source を "GitHub Actions" にする必要がある。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ユニット・ビルド一致・smoke・ブラウザ・PWA を通す。
      # Chromium が無い環境ではブラウザ系は自動でスキップされる。
      - run: npm test

  deploy:
    name: 公開
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 配布物だけを集める
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js site/
          cp -r icons site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
